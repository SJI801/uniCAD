[package]
name = "unicad-kernel"
version = "0.1.0"
edition = "2021"
description = "Geometry kernel for uniCAD - compiled to WebAssembly (wasm32-unknown-unknown)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
